[package]
name = "cybercafeShop-server"
version = "0.3.0"
edition = "2021"
description = "网吧点购系统 - 管理端服务核心（HTTP API + 数据库 + 播报）"

[lib]
name = "cybercafe_shop"
path = "src/lib.rs"

[[bin]]
name = "cybercafeShop-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
mime_guess = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["playsoundapi", "mmsystem"] }

[dev-dependencies]
ureq = "2"
tempfile = "3"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
